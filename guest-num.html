<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>猜数字游戏-带排行榜</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .container {
            border: 1px solid #cccccc;
            padding: 24px;
            border-radius: 12px;
        }
        .rank-box {
            margin-top:30px;
            border:1px solid #ddd;
            padding:20px;
            border-radius:10px;
        }
        input {
            padding:8px;
            font-size:16px;
            margin:4px;
        }
        button {
            padding:8px 14px;
            font-size:15px;
            cursor:pointer;
            margin:4px;
        }
        #tip {
            font-size:17px;
            margin:15px 0;
            min-height:24px;
        }
        table{
            width:100%;
            border-collapse: collapse;
        }
        th,td{
            border:1px solid #ccc;
            padding:8px;
            text-align:center;
        }
        th{
            background:#f5f5f5;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🎮猜数字游戏</h2>
    <p>猜1~100之间的整数，次数越少排名越高</p>

    <div>
        <label>玩家姓名：</label>
        <input type="text" id="username" placeholder="请输入你的名字">
    </div>
    <div>
        <input type="number" id="guessInput" placeholder="输入猜测数字" min="1" max="100">
        <button onclick="checkGuess()">提交猜测</button>
        <button onclick="restartGame()">重新游戏</button>
    </div>
    <div id="tip"></div>
</div>

<div class="rank-box">
    <h3>🏆排行榜（次数越少越优秀）</h3>
    <table>
        <thead>
            <tr>
                <th>排名</th>
                <th>玩家</th>
                <th>猜测次数</th>
            </tr>
        </thead>
        <tbody id="rankBody"></tbody>
    </table>
    <button onclick="clearRank()">清空排行榜</button>
</div>

<script>
let answer;
let count;

//初始化游戏
function initGame(){
    answer = Math.floor(Math.random()*100)+1;
    count = 0;
    document.getElementById("guessInput").value = "";
    document.getElementById("tip").innerText = "";
}
initGame();

//读取本地存储排行榜
function getRankList(){
    let str = localStorage.getItem("guess_rank");
    if(!str) return [];
    return JSON.parse(str);
}

//保存排行榜
function saveRank(list){
    localStorage.setItem("guess_rank", JSON.stringify(list));
}

//渲染排行榜页面
function renderRank(){
    let list = getRankList();
    //按猜测次数升序排序，次数少排前面
    list.sort((a,b)=> a.times - b.times);
    let tbody = document.getElementById("rankBody");
    tbody.innerHTML = "";
    for(let i=0;i<list.length;i++){
        let tr = document.createElement("tr");
        tr.innerHTML = `<td>${i+1}</td><td>${list[i].name}</td><td>${list[i].times}</td>`;
        tbody.appendChild(tr);
    }
}
renderRank();

//提交猜测
function checkGuess(){
    let name = document.getElementById("username").value.trim();
    if(!name){
        document.getElementById("tip").innerText = "⚠️请先输入玩家姓名！";
        return;
    }
    let val = document.getElementById("guessInput").value;
    let num = parseInt(val);
    let tipDom = document.getElementById("tip");

    if(isNaN(num)||num<1||num>100){
        tipDom.innerText = "⚠️请输入1‑100有效数字";
        return;
    }
    count++;
    if(num < answer){
        tipDom.innerText = `第${count}次：${num} 太小了！`;
    }else if(num > answer){
        tipDom.innerText = `第${count}次：${num} 太大了！`;
    }else{
        tipDom.innerText = `🎉恭喜猜对！答案：${answer}，一共${count}次！`;
        //猜对，存入排行榜
        let rank = getRankList();
        rank.push({name:name, times:count});
        saveRank(rank);
        renderRank();
    }
}

//重新一局
function restartGame(){
    initGame();
}

//清空排行榜
function clearRank(){
    localStorage.removeItem("guess_rank");
    renderRank();
}
</script>
</body>
</html>
